<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skattatillögur Sjálfstæðisflokksins</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    label, input, button, select { font-size: 1rem; }
    input, select { padding: 0.35rem; box-sizing: border-box; }
    input[type="number"] { width: 220px; }
    .row { margin: 0.7rem 0; display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
    .row .spacer { flex: 1; }
    .controls { margin-top: 0.6rem; padding: 0.9rem; border: 1px solid #e5e5e5; border-radius: 12px; background: #fafafa; }
    .controls .row { margin: 0.5rem 0; }
    .hint { font-size: 0.9rem; color: #555; margin: 0.2rem 0 0 0; line-height: 1.35; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 0.7em; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    tfoot tr { background: #f8f8f8; }
    .explain { font-size: 0.95em; color: #555; margin-top: 1em; line-height: 1.45; }
    #error { color: red; margin-left: 0.5em; }
    canvas { display: block; margin: 1.2em 0 0.8em 0; max-width: 100%; background: #fff; border: 1px solid #eee; border-radius: 12px; }
    .mono { font-variant-numeric: tabular-nums; }
    .pill { display:inline-block; padding:0.1rem 0.5rem; border-radius:999px; background:#eef6ff; color:#1b66c9; font-size:0.85rem; }
    .small { font-size: 0.9rem; }
  </style>
</head>

<body>
  <h1>Skattatillögur Sjálfstæðisflokksins</h1>

  <form id="salaryForm" class="row">
    <label for="salary">Upphæð (ISK):</label>
    <input id="salary" type="number" min="0" step="1000" value="900000" />
    <button type="submit">Reikna</button>
    <span id="error"></span>
  </form>

  <div class="controls" aria-label="Valmöguleikar">
    <div class="row">
      <label for="incomeType"><b>Tegund tekna:</b></label>
      <select id="incomeType">
        <option value="laun">Launatekjur</option>
        <option value="lifeyrir">Lífeyristekjur</option>
      </select>

      <span class="spacer"></span>

      <label for="showMetric"><b>Sýna í línuriti:</b></label>
      <select id="showMetric">
        <option value="netto">Nettó (eftir skatt)</option>
        <option value="skattur">Heildarskattur (eftir persónuafslátt)</option>
        <option value="diffnet">Nettó-mismunur (flatur − núverandi)</option>
      </select>
    </div>

    <div class="row">
      <label for="municipalRate"><b>Útsvar (%):</b></label>
      <!-- text til að leyfa bæði 14,94 og 14.94 -->
      <input id="municipalRate" type="text" inputmode="decimal" value="14,94" style="width:120px;" />
      <span class="hint">
        Sjálfgefið er vegið meðalútsvar 2026: <span class="mono">14,94%</span>. <span class="pill">útsvar</span>
      </span>
    </div>

    <div class="row" id="pensionDeductionControls" style="display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:0.5rem;">
        <input id="applyPensionDeduction" type="checkbox" />
        Draga iðgjald launþega í lífeyrissjóð frá skattstofni
      </label>

      <label for="pensionRate">Iðgjald (%):</label>
      <input id="pensionRate" type="text" inputmode="decimal" value="4,0" style="width:90px;" />
      <span class="hint" id="pensionOnlyHint">Gildir aðeins fyrir laun (ekki lífeyri).</span>
    </div>

    <p class="hint" id="staticHint"></p>
  </div>

  <div id="results"></div>
  <div class="explain" id="explain"></div>

  <canvas id="chart" width="760" height="310"></canvas>

  <div class="explain small">
    Ábending: Veldu <b>Heildarskattur</b> í línuriti til að bera beint saman við „Heild (eftir afsl.)“ í töflunni.
  </div>

<script>
/* ================= FASTAR TÖLUR (2026) =================
   Núverandi kerfi:
   - Þrepamörk á mánuði: 498.122 og 1.398.450
   - Tekjuskattur ríkis (án útsvars): 16,55% / 23,05% / 31,35%
   - Persónuafsláttur: 72.492 kr./mán
*/
const BRACKETS = { b1: 498122, b2: 1398450 };
const STATE = { r1: 0.1655, r2: 0.2305, r3: 0.3135 };
const PERSONAL_CREDIT = 72492;

// Sjálfgefið útsvar (veg. meðaltal 2026)
const DEFAULT_MUNICIPAL = 0.1494;

// Skattleysismörk sem texti (til skýringar í UI)
const TAXFREE = { laun: 239798, lifeyrir: 230206 };

/* ================= HJÁLPARFÖLL ================= */
const formatISK = x => x.toLocaleString("is-IS", { maximumFractionDigits: 0 });
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function parsePercent(value, fallbackPct) {
  // leyfa "14,94" og "14.94"
  const raw = (value ?? "").toString().trim().replace(",", ".");
  const num = Number(raw);
  if (!isFinite(num)) return fallbackPct;
  return clamp(num, 0, 30);
}

function getMunicipalRate() {
  const pct = parsePercent(document.getElementById("municipalRate").value, 14.94);
  return pct / 100;
}

function getPensionRate() {
  const pct = parsePercent(document.getElementById("pensionRate").value, 4.0);
  return clamp(pct, 0, 30) / 100;
}

/* ================= UI: VALMÖGULEIKAR ================= */
function updateControls() {
  const incomeType = document.getElementById("incomeType").value;
  const wrap = document.getElementById("pensionDeductionControls");
  const box = document.getElementById("applyPensionDeduction");
  const pensionHint = document.getElementById("pensionOnlyHint");

  if (incomeType === "lifeyrir") {
    wrap.style.display = "none";
    box.checked = false;
  } else {
    wrap.style.display = "flex";
    pensionHint.style.display = "inline";
  }
}

function updateStaticHint() {
  const hint = document.getElementById("staticHint");
  // textContent => engin Markdown/tenglar geta “fylgt með”
  hint.textContent =
    "Persónuafsláttur 2026 er 72.492 kr./mán (869.898 kr./ár). " +
    "Skattþrep 2026: 0–498.122 (31,49%), 498.123–1.398.450 (37,99%), yfir 1.398.450 (46,29%). " +
    "Skattleysismörk: laun 239.798 kr./mán og lífeyrir 230.206 kr./mán (miðað við fulla nýtingu persónuafsláttar).";
}

/* ================= SKATTSTOFN ================= */
function computeTaxBase(gross) {
  const incomeType = document.getElementById("incomeType").value;

  // Lífeyrir: ekki draga iðgjald frá
  if (incomeType === "lifeyrir") {
    return { taxBase: gross, applied: false, rate: 0 };
  }

  const apply = document.getElementById("applyPensionDeduction").checked;
  if (!apply) return { taxBase: gross, applied: false, rate: 0 };

  const rate = getPensionRate();
  return { taxBase: gross * (1 - rate), applied: true, rate };
}

/* ================= NÚVERANDI: TEKJUSKATTUR + ÚTSVAR ================= */
function calcStateTax(taxBase) {
  const { b1, b2 } = BRACKETS;
  const { r1, r2, r3 } = STATE;

  if (taxBase <= b1) return taxBase * r1;
  if (taxBase <= b2) return b1 * r1 + (taxBase - b1) * r2;
  return b1 * r1 + (b2 - b1) * r2 + (taxBase - b2) * r3;
}

function calcCurrentSystem(gross, taxBase, municipalRate) {
  const statePre = calcStateTax(taxBase);
  const municipalPre = taxBase * municipalRate;
  const totalPre = statePre + municipalPre;
  const totalAfter = Math.max(0, totalPre - PERSONAL_CREDIT);

  return {
    taxTotal: totalAfter,
    net: gross - totalAfter,
    breakdown: { statePre, municipalPre, totalPre, credit: PERSONAL_CREDIT, totalAfter }
  };
}

/* ================= FLAT 35% (DÆMI) =================
   Túlkað sem heildarstaðgreiðsla (tekjuskattur+útsvar).
   Þá er “tekjuskattshluti” = 35% - útsvar (minnsta 0).
*/
function calcFlatSystem(gross, taxBase, municipalRate) {
  const totalRate = 0.35;
  const stateFlatRate = Math.max(0, totalRate - municipalRate);

  const statePre = taxBase * stateFlatRate;
  const municipalPre = taxBase * municipalRate;
  const totalPre = statePre + municipalPre;

  const credit = 100000; // dæmi
  const totalAfter = Math.max(0, totalPre - credit);

  return {
    taxTotal: totalAfter,
    net: gross - totalAfter,
    breakdown: { statePre, municipalPre, totalPre, credit, totalAfter, totalRate, stateFlatRate }
  };
}

/* ================= AÐALREIKNINGUR ================= */
function calculate() {
  updateControls();

  const gross = Number(document.getElementById("salary").value) || 0;
  const errorEl = document.getElementById("error");
  const resultsEl = document.getElementById("results");
  const explainEl = document.getElementById("explain");

  errorEl.textContent = "";
  resultsEl.innerHTML = ""; // töflu-HTML er OK (ekki tilvísanir)
  explainEl.textContent = ""; // textContent til að forðast “romsu”

  if (gross < 0) {
    errorEl.textContent = "Upphæð getur ekki verið neikvæð.";
    clearChart();
    return;
  }

  const incomeType = document.getElementById("incomeType").value;
  const municipalRate = getMunicipalRate();
  const { taxBase, applied, rate } = computeTaxBase(gross);

  const cur = calcCurrentSystem(gross, taxBase, municipalRate);
  const flat = calcFlatSystem(gross, taxBase, municipalRate);

  // Skýringartexti án HTML/tengla
  const municipalPctStr = (municipalRate * 100).toFixed(2).replace(".", ",") + "%";
  const municipalTag = (Math.abs(municipalRate - DEFAULT_MUNICIPAL) < 1e-9)
    ? " (veg. meðalútsvar 2026)"
    : " (valið)";

  explainEl.textContent =
    "Útsvar í útreikningi: " + municipalPctStr + municipalTag + ". " +
    "Taflan aðgreinir tekjuskatt (ríki) og útsvar (sveitarfélag) fyrir persónuafslátt og sýnir síðan heild eftir persónuafslátt. " +
    "Skattleysismörk: " + (incomeType === "lifeyrir" ? "lífeyrir " : "laun ") +
    (incomeType === "lifeyrir" ? formatISK(TAXFREE.lifeyrir) : formatISK(TAXFREE.laun)) + " kr./mán miðað við fulla nýtingu persónuafsláttar.";

  const taxBaseLine = applied
    ? `Skattstofn (eftir ${(rate*100).toFixed(1).replace(".", ",")}% frádrátt): ISK ${formatISK(taxBase)}`
    : `Skattstofn: ISK ${formatISK(taxBase)}`;

  resultsEl.innerHTML = `
    <div class="hint" style="margin-top:0.6rem;"><b>${taxBaseLine}</b></div>

    <table>
      <thead>
        <tr>
          <th>Kerfi</th>
          <th>Tekjuskattur (fyrir afsl.)</th>
          <th>Útsvar (fyrir afsl.)</th>
          <th>Heild (fyrir afsl.)</th>
          <th>Persónuafsláttur</th>
          <th>Heild (eftir afsl.)</th>
          <th>Nettó</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><b>Núverandi (2026)</b></td>
          <td>ISK ${formatISK(cur.breakdown.statePre)}</td>
          <td>ISK ${formatISK(cur.breakdown.municipalPre)}</td>
          <td>ISK ${formatISK(cur.breakdown.totalPre)}</td>
          <td>− ISK ${formatISK(cur.breakdown.credit)}</td>
          <td><b>ISK ${formatISK(cur.taxTotal)}</b></td>
          <td><b>ISK ${formatISK(cur.net)}</b></td>
        </tr>
        <tr>
          <td><b>Flatur 35% (dæmi)</b></td>
          <td>ISK ${formatISK(flat.breakdown.statePre)}</td>
          <td>ISK ${formatISK(flat.breakdown.municipalPre)}</td>
          <td>ISK ${formatISK(flat.breakdown.totalPre)}</td>
          <td>− ISK ${formatISK(flat.breakdown.credit)}</td>
          <td><b>ISK ${formatISK(flat.taxTotal)}</b></td>
          <td><b>ISK ${formatISK(flat.net)}</b></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td><b>Mismunur (flatur − núverandi)</b></td>
          <td>ISK ${formatISK(flat.breakdown.statePre - cur.breakdown.statePre)}</td>
          <td>ISK ${formatISK(flat.breakdown.municipalPre - cur.breakdown.municipalPre)}</td>
          <td>ISK ${formatISK(flat.breakdown.totalPre - cur.breakdown.totalPre)}</td>
          <td></td>
          <td><b>ISK ${formatISK(flat.taxTotal - cur.taxTotal)}</b></td>
          <td><b>ISK ${formatISK(flat.net - cur.net)}</b></td>
        </tr>
      </tfoot>
    </table>

    <div class="hint" style="margin-top:0.6rem;">
      Flata kerfið er hér túlkað sem heildarstaðgreiðsla (tekjuskattur + útsvar) 35%.
      Þá verður “tekjuskattshluti” flata kerfisins = 35% − útsvar (minnst 0%).
    </div>
  `;

  drawChart();
}

/* ================= LÍNURIT ================= */
function drawChart() {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const metric = document.getElementById("showMetric").value;
  const municipalRate = getMunicipalRate();
  const grossMarker = Number(document.getElementById("salary").value) || 0;

  const M = { left: 94, right: 24, top: 18, bottom: 62 };
  const x0 = M.left, y0 = canvas.height - M.bottom;
  const x1 = canvas.width - M.right, y1 = M.top;
  const plotW = x1 - x0, plotH = y0 - y1;

  const maxGross = 2000000;
  const step = 20000;

  function calcAt(g) {
    const { taxBase } = computeTaxBase(g);
    const cur = calcCurrentSystem(g, taxBase, municipalRate);
    const flat = calcFlatSystem(g, taxBase, municipalRate);
    return { cur, flat };
  }

  function valueFor(g, sys) {
    const { cur, flat } = calcAt(g);
    if (metric === "netto") return sys === "cur" ? cur.net : flat.net;
    if (metric === "skattur") return sys === "cur" ? cur.taxTotal : flat.taxTotal;
    return flat.net - cur.net; // diffnet
  }

  let maxVal = -Infinity, minVal = Infinity;
  for (let g = 0; g <= maxGross; g += step) {
    if (metric === "diffnet") {
      const v = valueFor(g, "diff");
      maxVal = Math.max(maxVal, v); minVal = Math.min(minVal, v);
    } else {
      maxVal = Math.max(maxVal, valueFor(g, "cur"), valueFor(g, "flat"));
      minVal = Math.min(minVal, valueFor(g, "cur"), valueFor(g, "flat"));
    }
  }
  if (!isFinite(maxVal) || !isFinite(minVal) || maxVal === minVal) { maxVal = 1; minVal = 0; }
  const pad = (maxVal - minVal) * 0.08;
  maxVal += pad; minVal -= pad;

  const mapX = g => x0 + (g / maxGross) * plotW;
  const mapY = v => y0 - ((v - minVal) / (maxVal - minVal)) * plotH;

  // Axes
  ctx.beginPath();
  ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0);
  ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1; ctx.stroke();

  ctx.font = "12px system-ui"; ctx.fillStyle = "#444";
  const yTitle = metric === "netto" ? "Nettó (ISK)"
               : metric === "skattur" ? "Heildarskattur (ISK)"
               : "Nettó-mismunur (ISK)";

  ctx.save();
  ctx.translate(18, y1 + plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign = "center";
  ctx.fillText(yTitle, 0, 0);
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillText("Upphæð (brúttó)", x0 + plotW/2, canvas.height - 14);

  // Y ticks + grid
  ctx.textAlign = "right";
  for (let i = 0; i <= 4; i++) {
    const t = i/4;
    const val = minVal + t*(maxVal - minVal);
    const y = mapY(val);
    ctx.fillText(formatISK(val), x0 - 10, y + 4);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y);
    ctx.strokeStyle = "#eee"; ctx.stroke();
  }

  // X ticks
  ctx.textAlign = "center";
  for (let i = 0; i <= 4; i++) {
    const g = (i/4)*maxGross;
    ctx.fillText(formatISK(g), mapX(g), y0 + 20);
  }

  function drawCurve(sys, color) {
    ctx.beginPath();
    for (let g = 0; g <= maxGross; g += step) {
      const x = mapX(g);
      const v = (metric === "diffnet") ? valueFor(g, "diff") : valueFor(g, sys);
      const y = mapY(v);
      g === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  }

  if (metric === "diffnet") {
    drawCurve("diff", "#8b5cf6");
  } else {
    drawCurve("cur", "#0074d9");
    drawCurve("flat", "#2ecc40");
  }

  // Legend
  const lx = x1 - 245, ly = y1 + 10;
  ctx.font = "12px system-ui"; ctx.textAlign = "left";
  if (metric === "diffnet") {
    ctx.strokeStyle = "#8b5cf6"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly); ctx.stroke();
    ctx.fillStyle = "#8b5cf6";
    ctx.fillText("Mismunur (flatur − núverandi)", lx + 28, ly + 4);
  } else {
    ctx.strokeStyle = "#0074d9"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly); ctx.stroke();
    ctx.fillStyle = "#0074d9";
    ctx.fillText("Núverandi (2026)", lx + 28, ly + 4);

    ctx.strokeStyle = "#2ecc40"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, ly + 18); ctx.lineTo(lx + 20, ly + 18); ctx.stroke();
    ctx.fillStyle = "#2ecc40";
    ctx.fillText("Flatur 35% (dæmi)", lx + 28, ly + 22);
  }

  // Marker at chosen salary
  const gM = clamp(grossMarker, 0, maxGross);
  const xM = mapX(gM);

  ctx.save();
  ctx.setLineDash([5,4]);
  ctx.strokeStyle = "#999";
  ctx.beginPath(); ctx.moveTo(xM, y1); ctx.lineTo(xM, y0); ctx.stroke();
  ctx.restore();

  const { cur, flat } = calcAt(gM);
  function point(v, color, label, dy) {
    const y = mapY(v);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(xM, y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#222"; ctx.textAlign = "left";
    ctx.fillText(`${label}: ${formatISK(v)}`, xM + 8, y + dy);
  }

  if (metric === "netto") {
    point(cur.net, "#0074d9", "Núv.", -10);
    point(flat.net, "#2ecc40", "Flatur", 14);
  } else if (metric === "skattur") {
    point(cur.taxTotal, "#0074d9", "Núv. skattur", -10);
    point(flat.taxTotal, "#2ecc40", "Flatur skattur", 14);
  } else {
    point(flat.net - cur.net, "#8b5cf6", "Mismunur", -10);
  }
}

function clearChart() {
  const canvas = document.getElementById("chart");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
}

/* ================= RÆSING ================= */
document.getElementById("salaryForm").addEventListener("submit", e => {
  e.preventDefault();
  calculate();
});

// Nota change fyrir select (tryggara), input fyrir text/number reiti
document.getElementById("salary").addEventListener("input", calculate);
document.getElementById("incomeType").addEventListener("change", calculate);
document.getElementById("showMetric").addEventListener("change", calculate);
document.getElementById("municipalRate").addEventListener("input", calculate);
document.getElementById("applyPensionDeduction").addEventListener("change", calculate);
document.getElementById("pensionRate").addEventListener("input", calculate);

updateStaticHint();
updateControls();
calculate();
</script>
</body>
</html>
